# SecurePatch on Kubernetes.
#
#   kubectl apply -k k8s/base                  # deploy (uses locally built images)
#   kubectl apply -f k8s/jobs/model-pull.yaml  # first time: download the LLM
#
# Frontend http://localhost:8080 · Backend http://localhost:8000/docs
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: securepatch

labels:
  - pairs:
      app.kubernetes.io/part-of: securepatch
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - storage.yaml
  - ollama.yaml
  - backend.yaml
  - frontend.yaml
  - networkpolicy.yaml
