# FastAPI backend: Bandit, Semgrep, RAG, LLM repair, sandbox validation.
#
# Runs as ONE replica on purpose: validation state is kept in memory and the
# workspace volume is ReadWriteOnce. Scaling it needs shared state first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001   # makes the mounted volumes writable for the app user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: securepatch-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          volumeMounts:
            - name: workspace
              mountPath: /app/workspace
            - name: hf-cache
              mountPath: /home/app/.cache/huggingface
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # Loading the embedding model can take a while on first start.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: backend-workspace
        - name: hf-cache
          persistentVolumeClaim:
            claimName: backend-hf-cache
---
# LoadBalancer: on Docker Desktop this is published on localhost:8000,
# which is the API address baked into the frontend build.
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
