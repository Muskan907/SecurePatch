# Only the backend (and the model-pull job) may reach the LLM server.
# Enforced only when the cluster network plugin supports NetworkPolicy
# (e.g. Calico, Cilium). Docker Desktop accepts it but does not enforce it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-from-backend-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: model-pull
      ports:
        - port: 11434
