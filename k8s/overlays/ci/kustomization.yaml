# Used by the CD pipeline's Kubernetes test on a throwaway kind cluster.
# Ollama is scaled to 0 (its 3.4 GB image is not needed to prove the
# deployment works) and resource requests are lowered for the CI runner.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  - name: ollama
    count: 0
  - name: frontend
    count: 1
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value: {cpu: 100m, memory: 512Mi}
