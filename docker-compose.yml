# SecurePatch full stack: frontend + backend + local LLM (Ollama).
#
#   docker compose up -d --build
#
# By default the backend uses the Ollama already running on this computer
# (host.docker.internal:11434), so models are not downloaded twice.
# To run Ollama inside Docker instead (needs ~10 GB extra disk):
#   $env:OLLAMA_BASE_URL="http://ollama:11434"      # PowerShell
#   docker compose --profile ollama up -d --build
#   docker compose --profile ollama --profile setup run --rm model-pull
#
# Frontend: http://localhost:8080    Backend: http://localhost:8000/docs
# Live dashboard (Prometheus + Grafana): docker compose --profile monitoring up -d
#   Grafana http://localhost:3000   Prometheus http://localhost:9090
name: securepatch

services:
  ollama:
    image: ollama/ollama:0.40.17
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: securepatch-backend:local
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      # The backend container is the isolation boundary for test runs.
      SANDBOX_MODE: local
    volumes:
      - workspace:/app/workspace
      - hf-cache:/home/app/.cache/huggingface
    ports:
      - "8000:8000"
    # Lets the container reach Ollama on the host (automatic on Docker Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_started
        required: false   # only when the "ollama" profile is enabled
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:8000
    image: securepatch-frontend:local
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # One-off: download the default model into the ollama volume.
  model-pull:
    image: ollama/ollama:0.40.17
    profiles: ["setup"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5-coder:7b"]
    depends_on:
      - ollama

  # Live dashboard (optional):  docker compose --profile monitoring up -d
  # Grafana: http://localhost:3000 (dashboard "SecurePatch — Live",
  # anonymous viewing; admin/admin to edit)   Prometheus: http://localhost:9090
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    # Also scrapes a backend started on the host with uvicorn.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/securepatch.json
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Build-only: the locked-down test sandbox image used when the backend
  # runs on the host with SANDBOX_MODE=auto|docker.
  sandbox-image:
    build:
      context: sandbox
    image: securepatch-sandbox:latest
    profiles: ["setup"]

volumes:
  ollama-models:
  workspace:
  hf-cache:
  prometheus-data:
  grafana-data:
